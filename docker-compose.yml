version: '3.8'

# Q-Resilience AI: Quantum Microgrid Anomaly Detection Platform
# Orchestrates FastAPI + Qiskit backend and Vite + React frontend
# Repository: https://github.com/vtu-qiskit-fall-fest-2026/vtu-hc-ctrl-ai.git
# Team: Ctrl_AI (VTU-QFF-HC-0025)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: q-resilience-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: q-resilience-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: q-resilience-network
