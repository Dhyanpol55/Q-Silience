name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Service
        run: |
          echo "Sending Keep-Alive Ping to https://qresilience.vercel.app/..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://qresilience.vercel.app/")
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Keep-alive ping successful!"
            exit 0
          else
            echo "Warning: Received HTTP $STATUS"
            exit 0
          fi
